version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleor-razorpay-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - APP_IDENTIFIER=${APP_IDENTIFIER:-saleor.app.razorpay}
      # Optional: Upstash Redis APL (uncomment if using instead of FileAPL)
      # - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      # - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    volumes:
      # Persist FileAPL auth data across container restarts
      - ./data/auth:/app/.saleor-app-auth
      # Persist logs
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cloudflare Tunnel (optional — remove if running tunnel on host)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: saleor-razorpay-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
