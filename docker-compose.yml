version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleor-razorpay-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - APP_IDENTIFIER=${APP_IDENTIFIER:-saleor.app.razorpay}
      # Optional: Upstash Redis APL (uncomment if using instead of FileAPL)
      # - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
  # Cloudflare Tunnel (optional — remove if running tunnel on host)
    volumes:
      - ./auth-data:/app/.saleor-app-auth
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: saleor-razorpay-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
